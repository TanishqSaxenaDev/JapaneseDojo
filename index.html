<title>Nihongo Dojo · N5 Trainer</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#fdf5f6;--card:#fff;--tx:#2b2226;--mut:#85767c;--ac:#e0476b;--ac2:#6b5bd6;--ok:#2a9d6a;--bad:#d93a50;--gold:#f0a52b;--bd:#f0dfe3;--sh:0 6px 20px rgba(224,71,107,.08)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17121a;--card:#241c28;--tx:#f5ecf0;--mut:#ab9aa6;--ac:#ff7092;--ac2:#9b8cff;--ok:#4fd49a;--bad:#ff6b80;--gold:#ffc255;--bd:#38293d;--sh:0 6px 20px rgba(0,0,0,.3)}}
:root[data-theme="dark"]{--bg:#17121a;--card:#241c28;--tx:#f5ecf0;--mut:#ab9aa6;--ac:#ff7092;--ac2:#9b8cff;--ok:#4fd49a;--bad:#ff6b80;--gold:#ffc255;--bd:#38293d;--sh:0 6px 20px rgba(0,0,0,.3)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Zen Maru Gothic",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
.wrap{max-width:860px;margin:0 auto;padding:12px 14px 90px}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);padding:8px 0;display:flex;gap:8px;align-items:center}
nav b{font-size:1.1rem;margin-right:auto;white-space:nowrap}
.tab{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 14px;border-radius:999px;font:inherit;font-weight:700;cursor:pointer}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:12px;padding:11px 18px;background:var(--ac);color:#fff;font-weight:700;transition:transform .1s}
.btn:active{transform:scale(.96)}
.btn.g{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.s{padding:6px 12px;font-size:.85rem}
.btn.d{background:var(--bad)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:16px;box-shadow:var(--sh);margin-bottom:14px}
.card h3{margin:0 0 10px;font-size:1rem}
.hero{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;border-radius:22px;padding:18px;display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.hero .lv{font-size:1.5rem;font-weight:900}
.xpbar{height:10px;background:rgba(255,255,255,.3);border-radius:9px;overflow:hidden;margin-top:6px}
.xpbar i{display:block;height:100%;background:#fff;border-radius:9px;transition:width .5s}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));margin-bottom:14px}
.kpi{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:var(--sh)}
.kpi b{display:block;font-size:1.7rem;line-height:1.1}
.kpi span{color:var(--mut);font-size:.8rem}
.two{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.bar{height:9px;background:var(--bd);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));border-radius:9px;transition:width .4s}
.mode{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:14px;margin-bottom:10px;background:var(--card);border:1px solid var(--bd);border-radius:16px;color:var(--tx);box-shadow:var(--sh)}
.mode:hover{border-color:var(--ac)}
.mode em{font-size:1.8rem;font-style:normal}
.mode small{display:block;color:var(--mut)}
.chip{background:var(--bd);border-radius:999px;padding:3px 10px;font-size:.8rem;font-weight:700}
.q{font-size:1.7rem;font-weight:900;margin:16px 0;text-align:center;white-space:pre-line}
.opts{display:grid;gap:10px;grid-template-columns:1fr 1fr}
@media(max-width:480px){.opts{grid-template-columns:1fr}}
.opt{padding:14px;border:2px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx);font-size:1.1rem;font-weight:700}
.opt:hover:not(:disabled){border-color:var(--ac2)}
.opt.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.no{background:var(--bad);border-color:var(--bad);color:#fff;animation:sh .3s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
input,select,textarea{font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);max-width:100%}
input.big{width:100%;font-size:1.2rem;text-align:center}
.fb{margin-top:12px;padding:10px;border-radius:12px;font-weight:700;text-align:center}
.fb.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.fb.no{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.flip{min-height:170px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:1.6rem;font-weight:900;border:2px dashed var(--ac2);border-radius:18px;padding:16px;cursor:pointer}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:4px}
.heat i{aspect-ratio:1;border-radius:5px;background:var(--bd)}
.badge{display:flex;gap:8px;align-items:center;padding:8px;border-radius:12px;border:1px solid var(--bd);font-size:.85rem}
.badge.off{opacity:.35;filter:grayscale(1)}
.badge em{font-size:1.5rem;font-style:normal}
table{width:100%;border-collapse:collapse;font-size:.92rem}
td,th{padding:7px 6px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}
.scroll{overflow-x:auto;max-height:420px;overflow-y:auto}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:20;opacity:0;pointer-events:none;transition:opacity .25s;max-width:90vw}
#toast.on{opacity:1}
.pop{position:fixed;top:-20px;font-size:1.6rem;z-index:30;pointer-events:none;animation:fall 1.8s ease-in forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:.2}}
.sync{font-size:.75rem;color:var(--mut)}
.mut{color:var(--mut)}
svg text{fill:var(--mut);font-family:inherit}
.fl{border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:6px 14px;border-radius:999px;font-weight:700}
.fl.on{background:var(--ac2);color:#fff;border-color:var(--ac2)}
.kgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(72px,1fr))}
.kt{display:flex;flex-direction:column;align-items:center;padding:8px 2px;border:2px solid var(--bd);border-radius:14px;background:var(--card);color:var(--tx)}
.kt b{font-size:1.9rem;line-height:1.2}.kt small{font-size:.65rem;color:var(--mut);max-width:92%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.kt.l{border-color:var(--gold)}.kt.m{border-color:var(--ok)}.kt:hover{border-color:var(--ac2)}
.kt:focus-visible,.fl:focus-visible,.tab:focus-visible{outline:3px solid var(--ac2);outline-offset:2px}
nav{overflow-x:auto}.tab{white-space:nowrap}
</style>
</head>

  $$("[data-e]").forEach(b=>b.onclick=()=>{editId=b.dataset.e;wordsView();scrollTo(0,0)});
  $$("[data-d]").forEach(b=>b.onclick=()=>{if(b.dataset.c){deck=deck.filter(w=>w.id!==b.dataset.d);save();wordsView()}else{b.dataset.c=1;b.textContent="Sure?";setTimeout(()=>{b.dataset.c="";b.textContent="🗑️"},2500)}});
  if(e){$("#fcn").onclick=()=>{editId=null;wordsView()};$("#fsv").onclick=()=>{const p=$("#fp").value.trim(),a=$("#fa").value.trim();if(!p||!a)return toast("Fill in both the word and the answer");
    const o={t:$("#ft").value,p,a,sec:$("#fs").value.trim()||"Custom"};if(editId==="new")deck.push({id:"w"+Date.now(),...o,box:0,r:0,w:0,due:""});else Object.assign(e,o);editId=null;save();toast("Saved ✓");wordsView()}}
  $("#imp").onclick=()=>{let n=0;$("#bk").value.split("\n").forEach(l=>{const p=l.split("|").map(s=>s.trim());let t="J",x,y;if(p.length===2)[x,y]=p;else if(p.length>=3&&"JER".includes(p[0].toUpperCase())){t=p[0].toUpperCase();[,x,y]=p}else return;if(x&&y){deck.push({id:"w"+Date.now()+n++,t,p:x,a:y,sec:secF||"Custom",box:0,r:0,w:0,due:""})}});if(n){save();toast(n+" words imported");wordsView()}else toast("Nothing to import")};
  $("#exp").onclick=async()=>{const csv=deck.map(w=>[w.t,w.p,w.a,w.sec,w.box].map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n");
    try{const d=await claude.use("downloads");if(d)await d.save({filename:"n5-words.csv",data:"type,prompt,answer,section,level\n"+csv});else toast("Download isn't available here")}catch(e){}};
  $("#rst").onclick=function(){if(this.dataset.c){deck=seed();save();toast("Reset to the original deck");wordsView()}else{this.dataset.c=1;this.textContent="Tap again to confirm (progress is lost)";}};
}
init();render();
</script>
</body>
</html>
